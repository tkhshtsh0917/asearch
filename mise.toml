[tasks.build]
run = "cargo build --locked --workspace"

[tasks.audit]
run = [
  "mise exec cargo:cargo-audit@0.22.2 -- cargo audit --file Cargo.lock",
  "mise exec cargo:cargo-audit@0.22.2 -- cargo audit --file fuzz/Cargo.lock",
]

[tasks.lint]
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks.test]
run = "cargo test --locked --workspace"

[tasks.fuzz]
env = { ASAN_OPTIONS = "quarantine_size_mb=32:thread_local_quarantine_size_kb=64" }
run = [
  "cargo run --locked --manifest-path fuzz/Cargo.toml --example seeds -- fuzz/corpus/asix",
  "mise exec cargo:cargo-fuzz@0.13.2 -- cargo +nightly-2026-10-20 fuzz run asix -- -max_total_time=30 -max_len=65536 -rss_limit_mb=512 -dict=fuzz/asix.dict",
  "cargo run --locked --manifest-path fuzz/Cargo.toml --example intent-seeds -- fuzz/corpus/intent",
  "mise exec cargo:cargo-fuzz@0.13.2 -- cargo +nightly-2026-10-20 fuzz run intent -- -max_total_time=30 -max_len=512 -rss_limit_mb=512",
]
