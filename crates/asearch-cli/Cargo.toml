[package]
name = "asearch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native index builder, search and validation tools for asearch"
publish = false

[dependencies]
asearch-engine = { path = "../asearch-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.1", default-features = false }
asearch-builder = { path = "../asearch-builder" }
asearch-index = { path = "../asearch-index" }
asearch-analyzer = { path = "../asearch-analyzer" }
