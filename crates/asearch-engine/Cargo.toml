[package]
name = "asearch-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Asearch wildcard approximate matching with explicit compatibility profiles"

[dev-dependencies]
asearch-builder = { path = "../asearch-builder" }
serde_json = "1"

[features]
default = ["builder"]
builder = ["dep:asearch-builder"]

[dependencies]
asearch-index = { path = "../asearch-index" }
asearch-builder = { path = "../asearch-builder", optional = true }
sha2 = { version = "=0.11.1", default-features = false }
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
