name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: quarantine_size_mb=32:thread_local_quarantine_size_kb=64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-20 --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo run --locked --manifest-path fuzz/Cargo.toml --example seeds -- fuzz/corpus/asix
      - run: cargo +nightly-2026-10-20 fuzz run asix -- -max_total_time=30 -max_len=65536 -rss_limit_mb=512 -dict=fuzz/asix.dict
        env:
          CARGO_NET_OFFLINE: "true"
      - run: cargo run --locked --manifest-path fuzz/Cargo.toml --example intent-seeds -- fuzz/corpus/intent
      - run: cargo +nightly-2026-10-20 fuzz run intent -- -max_total_time=30 -max_len=512 -rss_limit_mb=512
        env:
          CARGO_NET_OFFLINE: "true"
      - run: git diff --exit-code -- fuzz/Cargo.lock

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  wasm-js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.0, 24.22.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm fixtures:check
        if: matrix.node == '22.22.0'
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm test
      - run: pnpm test:bench
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: matrix.node == '24.22.0'
      - run: pnpm test:browser
        if: matrix.node == '24.22.0'
