name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  CARGO_TERM_COLOR: always

jobs:
  security:
    uses: ./.github/workflows/security.yml
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: quarantine_size_mb=32:thread_local_quarantine_size_kb=64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-20 --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo run --locked --manifest-path fuzz/Cargo.toml --example seeds -- fuzz/corpus/asix
      - run: cargo +nightly-2026-10-20 fuzz run asix -- -max_total_time=30 -max_len=65536 -rss_limit_mb=512 -dict=fuzz/asix.dict
        env:
          CARGO_NET_OFFLINE: "true"
      - run: cargo run --locked --manifest-path fuzz/Cargo.toml --example intent-seeds -- fuzz/corpus/intent
      - run: cargo +nightly-2026-10-20 fuzz run intent -- -max_total_time=30 -max_len=512 -rss_limit_mb=512
        env:
          CARGO_NET_OFFLINE: "true"
      - run: git diff --exit-code -- fuzz/Cargo.lock

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, extension: "" }
          - { os: macos-14, platform: macos-aarch64, extension: "" }
          - { os: windows-latest, platform: windows-x86_64, extension: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p asearch-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build release payload
        shell: bash
        run: bash .github/scripts/package-artifacts.sh "${{ matrix.platform }}" "${{ matrix.extension }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asearch-assets-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            asearch-assets-*.tar.gz
            asearch-cli-*
            asearch_wasm.wasm
            asearch-licenses.tar.gz
            artifact-sha256sums-*.txt

  artifact-roundtrip:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: bash .github/scripts/verify-artifacts.sh
