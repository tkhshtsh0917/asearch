name: Release Rust artifacts
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  artifacts:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, extension: "" }
          - { os: macos-14, platform: macos-aarch64, extension: "" }
          - { os: windows-latest, platform: windows-x86_64, extension: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build and bundle
        shell: bash
        run: |
          set -euo pipefail
          identity=$(cargo pkgid -p asearch-engine)
          version=${identity##*#}
          version=${version##*@}
          test "$GITHUB_REF_NAME" = "v${version}"
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace/$(printf '\037')--remap-path-prefix=${HOME}=/build/home$(printf '\037')--remap-path-prefix=${CARGO_HOME:-${USERPROFILE:-$HOME}/.cargo}=/build/cargo$(printf '\037')--remap-path-prefix=$(rustc --print sysroot)=/build/rust"
          cargo build --locked --release -p asearch-cli
          cargo build --locked --release -p asearch-wasm --target wasm32-unknown-unknown
          mkdir -p bundle/licenses/rust-dependencies bundle/licenses/server-dependencies
          cp target/wasm32-unknown-unknown/release/asearch_wasm.wasm bundle/asearch_wasm.wasm
          cp target/release/asearch-cli${{ matrix.extension }} bundle/
          cp LICENSE-MIT LICENSE-APACHE NOTICE bundle/
          cp crates/asearch-engine/LICENSE-xxhash-rust.txt bundle/licenses/xxhash-rust.txt
          cp -R crates/asearch-engine/licenses/third-party/. bundle/licenses/rust-dependencies/
          cp -R crates/asearch-analyzer/licenses/third-party/. bundle/licenses/server-dependencies/
          cp crates/asearch-engine/LICENSE-Unicode-3.0.txt bundle/licenses/Unicode-3.0.txt
          tar -czf asearch-assets-${{ matrix.platform }}.tar.gz -C bundle .
          cp bundle/asearch-cli${{ matrix.extension }} asearch-cli-${{ matrix.platform }}${{ matrix.extension }}
          if [ "${{ matrix.platform }}" = "linux-x86_64" ]; then cp bundle/asearch_wasm.wasm .; tar -czf asearch-licenses.tar.gz -C bundle LICENSE-MIT LICENSE-APACHE NOTICE licenses; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: asearch-assets-${{ matrix.platform }}
          path: |
            asearch-assets-*.tar.gz
            asearch-cli-*
            asearch_wasm.wasm
            asearch-licenses.tar.gz
  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
      - name: Publish assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum asearch-assets-*.tar.gz asearch-cli-* asearch_wasm.wasm asearch-licenses.tar.gz > SHA256SUMS
          gh release create "$TAG" asearch-assets-*.tar.gz asearch-cli-* asearch_wasm.wasm asearch-licenses.tar.gz SHA256SUMS --verify-tag --generate-notes
  notify-demo:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check demo hook configuration
        env:
          APP_CLIENT_ID: ${{ vars.ASEARCH_DEMO_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ASEARCH_DEMO_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure ASEARCH_DEMO_APP_CLIENT_ID and ASEARCH_DEMO_APP_PRIVATE_KEY for the demo deployment hook."
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: demo-token
        with:
          client-id: ${{ vars.ASEARCH_DEMO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ASEARCH_DEMO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: asearch-demo
          permission-actions: write
      - name: Start demo validation for the published tag
        env:
          GH_TOKEN: ${{ steps.demo-token.outputs.token }}
          DEMO_REPOSITORY: ${{ github.repository_owner }}/asearch-demo
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run release-update.yml --repo "$DEMO_REPOSITORY" --ref main --field tag="$RELEASE_TAG"
