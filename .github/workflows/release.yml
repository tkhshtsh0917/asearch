name: Release Rust artifacts
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  artifacts:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, extension: "" }
          - { os: macos-14, platform: macos-aarch64, extension: "" }
          - { os: windows-latest, platform: windows-x86_64, extension: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build and bundle
        shell: bash
        run: |
          set -euo pipefail
          identity=$(cargo pkgid -p asearch-rs)
          version=${identity##*#}
          version=${version##*@}
          test "$GITHUB_REF_NAME" = "v${version}"
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace/$(printf '\037')--remap-path-prefix=${HOME}=/build/home$(printf '\037')--remap-path-prefix=${CARGO_HOME:-${USERPROFILE:-$HOME}/.cargo}=/build/cargo$(printf '\037')--remap-path-prefix=$(rustc --print sysroot)=/build/rust"
          cargo build --locked --release -p asearch-cli
          cargo build --locked --release -p asearch-wasm --target wasm32-unknown-unknown
          mkdir -p bundle/licenses/rust-dependencies
          cp target/release/asearch-cli${{ matrix.extension }} bundle/
          cp target/wasm32-unknown-unknown/release/asearch_wasm.wasm bundle/
          cp LICENSE-MIT LICENSE-APACHE NOTICE bundle/
          cp crates/asearch-rs/LICENSE-xxhash-rust.txt bundle/licenses/xxhash-rust.txt
          cp -R crates/asearch-rs/licenses/third-party/. bundle/licenses/rust-dependencies/
          cp crates/asearch-rs/LICENSE-Unicode-3.0.txt bundle/licenses/Unicode-3.0.txt
          tar -czf asearch-assets-${{ matrix.platform }}.tar.gz -C bundle .
          cp bundle/asearch-cli${{ matrix.extension }} asearch-cli-${{ matrix.platform }}${{ matrix.extension }}
          if [ "${{ matrix.platform }}" = "linux-x86_64" ]; then cp bundle/asearch_wasm.wasm .; tar -czf asearch-licenses.tar.gz -C bundle LICENSE-MIT LICENSE-APACHE NOTICE licenses; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asearch-assets-${{ matrix.platform }}
          path: |
            asearch-assets-*.tar.gz
            asearch-cli-*
            asearch_wasm.wasm
            asearch-licenses.tar.gz
  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
      - name: Publish assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum asearch-assets-*.tar.gz asearch-cli-* asearch_wasm.wasm asearch-licenses.tar.gz > SHA256SUMS
          gh release create "$TAG" asearch-assets-*.tar.gz asearch-cli-* asearch_wasm.wasm asearch-licenses.tar.gz SHA256SUMS --verify-tag --generate-notes
